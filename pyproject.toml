[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bioasq-hybrid-retrieval"
version = "0.1.0"
description = "Closed-corpus biomedical literature retrieval with BM25 and MedCPT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Akshith Gupta" }]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
data = [
  "datasets>=3,<5",
]
neural = [
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
]
plots = [
  "matplotlib>=3.8,<4",
]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
all = [
  "datasets>=3,<5",
  "matplotlib>=3.8,<4",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
